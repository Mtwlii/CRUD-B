<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bahnnoos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/stylest.css" />
</head>

<body>

    <div class="w-50 m-auto mt-5 text-center">
        <label for="firstName" class="form-label"> First Name</label>
        <input type="text" id="firstName" class="form-control" name="firstName" placeholder="First Name">
        <label for="lastName" class="form-label"> Last Name</label>
        <input type="text" id="lastName" class="form-control" name="lastName" placeholder="Last Name">
        <label for="email" class="form-label"> Email</label>
        <input type="email" id="email" class="form-control" name="email" placeholder="Email">
        <div class="form-floating mt-3">
            <input list="categories" class="form-control " type="text" id="category">
            <label for="category" class="form-label">Category</label>
            <datalist id="categories">
                <option value="TV">
                <option value="Mobile">
                <option value="Laptop">
                <option value="Screens">
                <option value="Electronics">
            </datalist>
        </div>
        <button onclick="addPerson()" id="addBtn" class="btn btn-success mt-3">Add</button>
        <button id="updateBtn" onclick="updatePerson()" class=" d-none btn btn-warning text-dark mt-3">Update</button>
    </div>
    <input type="text" placeholder="Search By First Name or Last Name or Email or Category..." onkeyup="searchPerson()" class="form-control mt-2 w-50 m-auto"
        name="" id="search">
    <div class="container">
        <table class="table mt-5">
            <thead>
                <tr>
                    <th scope="col">First Name</th>
                    <th scope="col">Last Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Category</th>
                    <th scope="col">Delete</th>
                    <th scope="col">Update</th>

                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
</body>

</html>
